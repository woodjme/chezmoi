"$schema" = 'https://starship.rs/config-schema.json'

format = """$username$hostname${custom.company}${custom.dir}$git_branch$git_status$git_state$character"""
right_format = """$terraform${custom.awsprofile}"""

[character]
success_symbol = "[➜](bold #98e024)"
error_symbol = "[➜](bold #f4005f)"
format = "$symbol "

[username]
style_user = "bold #98e024"
style_root = "bold #f4005f"
format = '[$user]($style)[@](bold #58d1eb)'
disabled = false
show_always = false

[hostname]
ssh_only = true
style = "bold #58d1eb"
format = '[$hostname]($style)[: ](bold #58d1eb)'
disabled = false

[directory]
disabled = true

[custom.company]
command = '''
d=$PWD; root=""
while :; do
  [[ -e $d/.git ]] && { root=$d; break; }
  [[ $d == / || -z $d ]] && break
  d=${d%/*}; [[ -z $d ]] && d=/
done
[[ -z $root ]] && exit 0

parent=${root%/*}; [[ -z $parent ]] && parent=/
[[ $parent == "$HOME/git" || $parent == "$HOME/git/"* ]] && echo "${parent##*/}:"
'''
when = true
require_repo = true
style = "bold #f4005f"
format = '[$output]($style)'
shell = ["bash", "--noprofile", "--norc"]

[custom.dir]
command = '''
trunc() { local d=$1; if (( ${#d} > 12 )); then REPLY="${d:0:6}.${d: -5}"; else REPLY=$d; fi; }

d=$PWD; root=""
while :; do
  [[ -e $d/.git ]] && { root=$d; break; }
  [[ $d == / || -z $d ]] && break
  d=${d%/*}; [[ -z $d ]] && d=/
done

cur=${PWD##*/}; [[ -z $cur ]] && cur=/
[[ -z $root ]] && { echo "$cur"; exit 0; }

trunc "${root##*/}"; repo=$REPLY
[[ $PWD == "$root" ]] && { echo "$repo"; exit 0; }

trunc "$cur"; cur=$REPLY
rel=${PWD#"$root"/}; slashes=${rel//[!\/]}; depth=${#slashes}

if (( depth == 0 )); then
  echo "$repo/$cur"
elif (( depth == 1 )); then
  trunc "${rel%%/*}"; echo "$repo/$REPLY/$cur"
else
  echo "$repo/[$((depth + 1))]/$cur"
fi
'''
when = true
style = "bold #58d1eb"
format = '[$output]($style) '
shell = ["bash", "--noprofile", "--norc"]

[git_branch]
symbol = "git:"
style = "bold #9d65ff"
format = '[$symbol](bold #9d65ff)[\(](bold #9d65ff)[$branch](bold #f4005f)[\)](bold #9d65ff) '

[git_status]
style = "bold #fd971f"
format = '[$all_status$ahead_behind]($style) '
conflicted = "!${count} "
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↕${ahead_count}/${behind_count}"
untracked = "?${count} "
stashed = "*${count} "
modified = "~${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "x${count} "

[git_state]
style = "bold #e0d561"
format = '[\($state( $progress_current/$progress_total)\)]($style) '

[terraform]
symbol = "tf:"
style = "bold #9d65ff"
format = '[$symbol$workspace]($style) '

[custom.awsprofile]
command = 'if [ -n "$AWS_PROFILE" ]; then echo "aws:$AWS_PROFILE${AWS_PROFILE_REGION:+ ($AWS_PROFILE_REGION)}"; fi'
when = true
style = "bold #fd971f"
format = '[$output]($style) '
shell = ["bash", "--noprofile", "--norc"]
